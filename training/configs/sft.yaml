# python -m training.train_sft --config training/configs/sft.yaml
# Default: Qwen2.5-1.5B-Instruct (Apache-2.0, no gated access) + LoRA, fits a 16-24 GB GPU in bf16.
# Bigger GPU: --set model.name=Qwen/Qwen2.5-7B-Instruct model.load_in_4bit=true
# Same model family as the v3 zero-shot benchmark: meta-llama/Llama-3.1-8B-Instruct (gated: accept the license on
# Hugging Face and run `hf auth login` first).
seed: 42
report_to: none                 # or tensorboard / wandb
model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  load_in_4bit: false           # QLoRA (needs bitsandbytes, Linux + CUDA)
  attn_implementation: null     # e.g. flash_attention_2 if installed
data:
  dir: null                     # default training/datasets
  limit_train: null
  limit_val: 600
lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
train:
  num_train_epochs: 2
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 50
  weight_decay: 0.0
  max_length: 3072              # prompts are ~1k tokens; 3072 leaves headroom
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  load_best_model_at_end: true
  metric_for_best_model: eval_loss

smoke:
  model: {name: tiny-offline}
  data: {dir: training/runs/smoke_datasets, limit_train: 8, limit_val: 4}
  lora: {target_modules: [q_proj, v_proj]}
  train:
    use_cpu: true
    max_steps: 2
    num_train_epochs: 1
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 1
    gradient_checkpointing: false
    logging_steps: 1
    eval_steps: 2
    save_steps: 2
