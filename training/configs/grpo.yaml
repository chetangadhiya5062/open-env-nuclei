# python -m training.train_grpo --config training/configs/grpo.yaml --set model.adapter=training/runs/sft/<run>/adapter
seed: 42
report_to: none
model:
  name: Qwen/Qwen2.5-1.5B-Instruct   # must be the base model of the SFT adapter
  adapter: null                      # path to the SFT LoRA adapter (recommended)
data:
  dir: null                          # default training/datasets
  limit_train: null
lora:                                # used only when no adapter is given
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
train:
  num_train_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  num_generations: 8                 # group size; per_device_train_batch_size*grad_accum must be divisible by it
  max_completion_length: 96          # an action is ~20-60 tokens
  temperature: 0.9
  beta: 0.02                         # KL penalty to the reference model
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_steps: 20
  logging_steps: 5
  save_strategy: steps
  save_steps: 100
  gradient_checkpointing: true
  log_completions: false
  use_vllm: false                    # true + `pip install vllm` makes generation several times faster

smoke:
  model: {name: tiny-offline, adapter: null}
  data: {dir: training/runs/smoke_datasets, limit_train: 4}
  lora: {target_modules: [q_proj, v_proj]}
  train:
    use_cpu: true
    max_steps: 1
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 1
    num_generations: 2
    max_completion_length: 16
    logging_steps: 1
    save_steps: 1
    gradient_checkpointing: false
