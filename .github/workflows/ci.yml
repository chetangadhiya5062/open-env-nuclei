name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: CLI smoke
        run: |
          fe sample churn --rows 500 --out /tmp/churn.csv
          fe run /tmp/churn.csv --target churned --level full --test-size 0.2 --out-dir /tmp/ff_out
          fe transform /tmp/churn.csv --pipeline /tmp/ff_out/pipeline --out /tmp/t.parquet

  training-smoke:
    # Every GPU training script runs for 1-2 steps on CPU with a tiny offline model (no downloads, no real training).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            training/requirements-gpu.txt
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install -r training/requirements-gpu.txt
      - name: Verify committed datasets
        run: python -m training.verify_datasets
      - name: Smoke-test training scripts
        run: bash training/smoke_test.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build environment image
        run: docker build -t openenv-data-cleaning .
      - name: Smoke test the environment container
        run: |
          docker run -d --name env -p 7860:7860 openenv-data-cleaning
          for i in $(seq 1 30); do curl -sf http://localhost:7860/health && break; sleep 2; done
          curl -sf http://localhost:7860/health || (docker logs env; exit 1)
      - name: Build FeatureForge image
        run: docker build -f docker/featureforge.Dockerfile -t featureforge .
      - name: Smoke test the FeatureForge container
        run: |
          docker run -d --name ff -p 8000:8000 featureforge
          for i in $(seq 1 40); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health || (docker logs ff; exit 1)
          printf 'a,b,y\n1,x,0\n2,y,1\n3,x,0\n4,y,1\n' > /tmp/d.csv
          curl -sf -F "file=@/tmp/d.csv" -F "target=y" http://localhost:8000/v1/profile > /dev/null
          curl -sf http://localhost:8000/ui/ > /dev/null
