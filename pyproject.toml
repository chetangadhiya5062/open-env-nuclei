[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-data-cleaning"
version = "0.4.0"
description = "FeatureForge: reproducible data cleaning and feature engineering for tabular data, plus an OpenEnv RL environment for data cleaning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Single source of truth for dependencies. requirements.txt mirrors the runtime
# list (a test checks they agree) because Hugging Face / Docker installs from it.
dependencies = [
    "openenv-core[core]>=0.3.0,<0.4",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
    "gradio>=5,<7",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "typer>=0.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.8"]
# only needed to TRAIN the RL agent (train_rl.py); running the trained policy needs numpy only
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3", "torch>=2.2", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "torch>=2.2",
]

[project.scripts]
server = "data_cleaning_env.server.app:main"
fe = "featureforge.cli:app"
featureforge = "featureforge.cli:app"

[tool.setuptools.packages.find]
include = ["data_cleaning_env*", "agents*", "featureforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "benchmark_results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "data_cleaning_env", "featureforge", "tests", "training"]
