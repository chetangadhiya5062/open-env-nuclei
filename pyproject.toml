[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-data-cleaning"
version = "0.2.0"
description = "OpenEnv reinforcement-learning environment for tabular data cleaning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Single source of truth for dependencies. requirements.txt mirrors the runtime
# list (a test checks they agree) because Hugging Face / Docker installs from it.
dependencies = [
    "openenv-core[core]>=0.3.0,<0.4",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
    "gradio>=5,<7",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[project.scripts]
server = "data_cleaning_env.server.app:main"

[tool.setuptools.packages.find]
include = ["data_cleaning_env*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "benchmark_results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "data_cleaning_env", "tests"]
